<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Museum of Us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Special+Elite&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --burgundy:#6b1420;
    --burgundy-dark:#4a0e17;
    --cream:#f3ead9;
    --gold:#b08d57;
    --ink:#2b1810;
    --rose:#c1666b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'EB Garamond', serif;
    background:var(--ink);
    color:var(--ink);
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  .screen{
    min-height:100svh;
    width:100%;
    position:relative;
    display:none;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    background:linear-gradient(180deg, var(--burgundy) 0%, var(--burgundy-dark) 100%);
    overflow:hidden;
  }
  .screen.active{display:flex;}

  /* ================= SCREEN 1: ENTRY ================= */
  #entry{
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:32px 24px;
    background:
      radial-gradient(circle at 50% 20%, rgba(176,141,87,0.15), transparent 55%),
      linear-gradient(180deg, var(--burgundy) 0%, var(--burgundy-dark) 100%);
  }
  .locked-title{
    font-family:'Rye', serif;
    color:var(--cream);
    -webkit-text-stroke:1.5px var(--burgundy-dark);
    font-size:2.6rem;
    line-height:1.15;
    letter-spacing:1px;
    text-shadow:3px 3px 0 var(--burgundy-dark);
    margin:0 0 6px 0;
  }
  .entry-sub{
    font-family:'Special Elite', monospace;
    color:var(--gold);
    font-size:0.85rem;
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:36px;
    opacity:0.9;
  }
  .gate-icon{
    font-size:2.2rem;
    margin-bottom:18px;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,0.4));
  }
  .ticket-slot{
    position:relative;
    width:min(320px, 78vw);
    border:2.5px dashed var(--gold);
    border-radius:14px;
    padding:28px 18px;
    background:rgba(243,234,217,0.06);
    transition:all 0.35s ease;
  }
  .ticket-slot.filled{
    border-style:solid;
    background:rgba(176,141,87,0.15);
  }
  .ticket-slot input[type=file]{
    position:absolute;
    inset:0;
    opacity:0;
    cursor:pointer;
    width:100%;
    height:100%;
  }
  .slot-label{
    font-family:'Special Elite', monospace;
    color:var(--cream);
    font-size:0.95rem;
    letter-spacing:0.5px;
  }
  .slot-hint{
    font-family:'EB Garamond', serif;
    font-style:italic;
    color:rgba(243,234,217,0.65);
    font-size:0.82rem;
    margin-top:8px;
  }
  .ticket-preview{
    margin-top:14px;
    max-width:140px;
    max-height:90px;
    border-radius:6px;
    border:2px solid var(--gold);
    display:none;
    object-fit:cover;
  }
  .ticket-preview.show{display:inline-block;}
  .enter-btn{
    margin-top:28px;
    font-family:'Special Elite', monospace;
    background:var(--gold);
    color:var(--burgundy-dark);
    border:none;
    padding:14px 34px;
    border-radius:30px;
    font-size:0.95rem;
    letter-spacing:2px;
    text-transform:uppercase;
    cursor:pointer;
    opacity:0.35;
    pointer-events:none;
    transition:all 0.4s ease;
    box-shadow:0 6px 18px rgba(0,0,0,0.35);
  }
  .enter-btn.ready{
    opacity:1;
    pointer-events:auto;
    animation:pulseGlow 1.8s ease-in-out infinite;
  }
  @keyframes pulseGlow{
    0%,100%{box-shadow:0 6px 18px rgba(176,141,87,0.35);}
    50%{box-shadow:0 6px 26px rgba(176,141,87,0.75);}
  }
  .stamp{
    position:absolute;
    font-family:'Rye', serif;
    color:var(--rose);
    border:3px solid var(--rose);
    border-radius:10px;
    padding:4px 10px;
    font-size:0.75rem;
    letter-spacing:1px;
    transform:rotate(-14deg);
    opacity:0;
    top:-10px;
    right:-6px;
    transition:opacity 0.3s ease, transform 0.3s ease;
  }
  .stamp.show{opacity:0.9; transform:rotate(-10deg) scale(1);}

  /* ================= SCREEN 2 & 3: FULL IMAGE PAGES ================= */
  .page-scroll{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-bottom:36px;
  }
  .page-scroll img{
    width:100%;
    display:block;
  }
  .nav-btn{
    margin:22px 0 4px 0;
    font-family:'Special Elite', monospace;
    background:var(--cream);
    color:var(--burgundy);
    border:2px solid var(--gold);
    padding:14px 36px;
    border-radius:30px;
    font-size:0.9rem;
    letter-spacing:2px;
    text-transform:uppercase;
    cursor:pointer;
    transition:transform 0.2s ease, background 0.2s ease;
  }
  .nav-btn:active{transform:scale(0.96);}
  .nav-btn:hover{background:var(--gold); color:var(--burgundy-dark);}

  @media (min-width:700px){
    .locked-title{font-size:3.2rem;}
    .page-scroll{max-width:480px;}
  }
</style>
</head>
<body>

<!-- ========== SCREEN 1: ENTRY ========== -->
<section class="screen active" id="entry">
  <div class="gate-icon">&#128274;</div>
  <h1 class="locked-title">MUSEUM OF US &lt;3</h1>
  <p class="entry-sub">Admittance by Ticket Only</p>

  <div class="ticket-slot" id="ticketSlot">
    <span class="stamp" id="stamp">ADMIT</span>
    <input type="file" accept="image/*" id="ticketInput" aria-label="Attach your ticket">
    <div class="slot-label" id="slotLabel">Send your ticket here</div>
    <div class="slot-hint" id="slotHint"></div>
    <img id="ticketPreview" class="ticket-preview" alt="Your ticket">
  </div>

  <button class="enter-btn" id="enterBtn">Enter the Museum</button>
</section>

<!-- ========== SCREEN 2: MUSEUM ========== -->
<section class="screen" id="museum">
  <div class="page-scroll">
    <img src="museum.jpg" alt="Museum of Us">
    <button class="nav-btn" id="toGiftShop">Proceed to the Gift Shop &rarr;</button>
  </div>
</section>

<!-- ========== SCREEN 3: GIFT SHOP ========== -->
<section class="screen" id="giftshop">
  <div class="page-scroll">
    <img src="giftshop.jpg" alt="The Gift Shop">
    <button class="nav-btn" id="backToMuseum">&larr; Back to the Museum</button>
  </div>
</section>

<script>
(function(){
  const ticketInput = document.getElementById('ticketInput');
  const ticketSlot = document.getElementById('ticketSlot');
  const ticketPreview = document.getElementById('ticketPreview');
  const slotLabel = document.getElementById('slotLabel');
  const stamp = document.getElementById('stamp');
  const enterBtn = document.getElementById('enterBtn');

  ticketInput.addEventListener('change', function(e){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){
      ticketPreview.src = ev.target.result;
      ticketPreview.classList.add('show');
    };
    reader.readAsDataURL(file); // preview only, nothing is uploaded or stored anywhere
    ticketSlot.classList.add('filled');
    slotLabel.textContent = 'Ticket accepted';
    stamp.classList.add('show');
    enterBtn.classList.add('ready');
  });

  enterBtn.addEventListener('click', function(){
    document.getElementById('entry').classList.remove('active');
    document.getElementById('museum').classList.add('active');
    window.scrollTo(0,0);
  });

  document.getElementById('toGiftShop').addEventListener('click', function(){
    document.getElementById('museum').classList.remove('active');
    document.getElementById('giftshop').classList.add('active');
    window.scrollTo(0,0);
  });

  document.getElementById('backToMuseum').addEventListener('click', function(){
    document.getElementById('giftshop').classList.remove('active');
    document.getElementById('museum').classList.add('active');
    window.scrollTo(0,0);
  });
})();
</script>
</body>
</html>
